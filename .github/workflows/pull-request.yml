on: pull_request
name: Pull Request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version: 24
      - name: Install dependencies
        env:
          CI: true
        run: npm install
      - name: Test
        run: npm test
      - name: Check docs links
        run: node tools/check-doc-links.mjs
